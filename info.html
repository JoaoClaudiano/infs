<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Analytics | JoaoClaudiano</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-deep: #080a0f;
            --glass-bg: rgba(22, 27, 34, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #7c4dff; /* Roxo Neon */
            --accent-secondary: #00e5ff; /* Ciano Neon */
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(124, 77, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            animation: fadeIn 1s ease-out;
        }

        /* Efeito de Vidro (Glassmorphism) */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(124, 77, 255, 0.3);
            transform: translateY(-5px);
        }

        /* Header e Perfil */
        .header-card { grid-column: span 12; display: flex; align-items: center; gap: 30px; }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-primary);
            padding: 5px;
        }

        .profile-info h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        .profile-info p { color: var(--text-dim); font-size: 1rem; }

        /* Grade de Cards */
        .card-medium { grid-column: span 6; }
        .card-small { grid-column: span 4; }
        .card-large { grid-column: span 8; }

        @media (max-width: 900px) {
            .card-medium, .card-small, .card-large { grid-column: span 12; }
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title i { color: var(--accent-secondary); }

        /* Estatísticas Numéricas */
        .big-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label { color: var(--text-dim); font-size: 0.85rem; margin-top: 5px; }

        /* Gráficos */
        .chart-container { width: 100%; height: 280px; position: relative; }

        /* Lista de Repos */
        .repo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .repo-item:last-child { border: none; }
        .repo-name { font-weight: 600; color: var(--accent-secondary); text-decoration: none; font-size: 0.95rem; }
        .repo-meta { font-size: 0.8rem; color: var(--text-dim); }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    </style>
</head>
<body>

    <div class="container">
        <header class="glass-card header-card">
            <img id="user-avatar" class="profile-img" src="https://github.com/identicons/j.png" alt="Avatar">
            <div class="profile-info">
                <h1 id="user-name">Carregando...</h1>
                <p id="user-bio">Analista de Dados & Desenvolvedor Full Stack</p>
                <div style="margin-top: 15px; display: flex; gap: 20px;">
                    <div><span class="big-number" id="total-repos">0</span><div class="stat-label">Repos</div></div>
                    <div><span class="big-number" id="total-stars">0</span><div class="stat-label">Estrelas</div></div>
                    <div><span class="big-number" id="user-followers">0</span><div class="stat-label">Seguidores</div></div>
                </div>
            </div>
        </header>

        <section class="glass-card card-small">
            <h3 class="card-title"><i class="fa-solid fa-microchip"></i> Tech Stack Balance</h3>
            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </section>

        <section class="glass-card card-small">
            <h3 class="card-title"><i class="fa-solid fa-code"></i> Top Linguagens</h3>
            <div class="chart-container">
                <canvas id="donutChart"></canvas>
            </div>
        </section>

        <section class="glass-card card-small">
            <h3 class="glass-card-title card-title"><i class="fa-solid fa-fire"></i> Projetos Populares</h3>
            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </section>

        <section class="glass-card card-large">
            <h3 class="card-title"><i class="fa-solid fa-folder-open"></i> Repositórios em Destaque</h3>
            <div id="repo-list">
                </div>
        </section>

        <section class="glass-card card-small" style="display: flex; flex-direction: column; justify-content: center;">
            <h3 class="card-title"><i class="fa-solid fa-clock"></i> Live Coding Stats</h3>
            <img src="https://github-readme-stats.vercel.app/api/wakatime?username=JoaoClaudiano&theme=transparent&color_accent=00e5ff&hide_border=true" style="width: 100%; filter: drop-shadow(0 0 10px rgba(0,229,255,0.2));" alt="Wakatime">
        </section>

    </div>

    <script>
        const USER = 'JoaoClaudiano';

        async function initDashboard() {
            try {
                // 1. Dados do Usuário
                const userRes = await fetch(`https://api.github.com/users/${USER}`);
                const userData = await userRes.json();
                
                document.getElementById('user-avatar').src = userData.avatar_url;
                document.getElementById('user-name').innerText = userData.name || USER;
                document.getElementById('user-bio').innerText = userData.bio || 'Developer';
                document.getElementById('user-followers').innerText = userData.followers;
                document.getElementById('total-repos').innerText = userData.public_repos;

                // 2. Dados dos Repositórios
                const reposRes = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`);
                const repos = await reposRes.json();

                let stars = 0;
                let langs = {};
                repos.forEach(r => {
                    stars += r.stargazers_count;
                    if(r.language) langs[r.language] = (langs[r.language] || 0) + 1;
                });
                document.getElementById('total-stars').innerText = stars;

                // Renderizar Componentes
                renderDonut(langs);
                renderRadar(); // Dados baseados no seu perfil GitHub
                renderBar(repos.slice(0, 5));
                renderRepoList(repos.slice(0, 6));

            } catch (e) { console.error("Erro ao carregar:", e); }
        }

        function renderDonut(langs) {
            const ctx = document.getElementById('donutChart');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(langs),
                    datasets: [{
                        data: Object.values(langs),
                        backgroundColor: ['#7c4dff', '#00e5ff', '#ff4081', '#76ff03', '#ffeb3b'],
                        borderWidth: 0,
                        hoverOffset: 20
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#8b949e', usePointStyle: true, padding: 20 } } },
                    cutout: '75%'
                }
            });
        }

        function renderRadar() {
            const ctx = document.getElementById('radarChart');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Backend', 'Frontend', 'Database', 'Mobile', 'DevOps', 'Data Science'],
                    datasets: [{
                        label: 'Experiência',
                        data: [85, 70, 75, 40, 60, 50],
                        fill: true,
                        backgroundColor: 'rgba(124, 77, 255, 0.2)',
                        borderColor: '#7c4dff',
                        pointBackgroundColor: '#00e5ff'
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.05)' },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            pointLabels: { color: '#8b949e' },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderBar(topRepos) {
            const ctx = document.getElementById('barChart');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: topRepos.map(r => r.name.substring(0,10)),
                    datasets: [{
                        data: topRepos.map(r => r.stargazers_count + 1), // +1 apenas para visualização se 0
                        backgroundColor: '#00e5ff',
                        borderRadius: 8
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: { 
                        y: { display: false },
                        x: { ticks: { color: '#8b949e' }, grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderRepoList(repos) {
            const container = document.getElementById('repo-list');
            container.innerHTML = repos.map(r => `
                <div class="repo-item">
                    <div>
                        <a href="${r.html_url}" target="_blank" class="repo-name">${r.name}</a>
                        <div class="repo-meta">${r.language || 'Code'} • Updated ${new Date(r.updated_at).toLocaleDateString()}</div>
                    </div>
                    <div class="repo-meta">
                        <i class="fa-regular fa-star"></i> ${r.stargazers_count}
                    </div>
                </div>
            `).join('');
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
